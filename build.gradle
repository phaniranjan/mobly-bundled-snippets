plugins {
    id 'java-library'
    id 'com.github.sherter.google-java-format' version '0.9'
}

allprojects {
    repositories {
        mavenCentral()
    }
    gradle.projectsEvaluated {
        tasks.withType(JavaCompile) {
            options.compilerArgs << "-Xlint:all"
        }
    }
}

base {
    archivesName = 'mobly-bundled-snippets'
}

group = 'com.google.android.mobly.snippet.bundled'
version = '0.0.1'

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java', 'src/stubs/java']
        }
    }
}

// Produces a jar of source files. Needed for compliance reasons.
task sourcesJar(type: Jar) {
    from sourceSets.main.java.srcDirs
    archiveClassifier.set('src')
}

artifacts {
    archives sourcesJar
}

dependencies {
    implementation 'com.google.code.gson:gson:2.8.6'
    implementation 'com.google.guava:guava:31.0.1-jre'
    implementation 'com.google.errorprone:error_prone_annotations:2.15.0'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.6.10'
    implementation 'org.json:json:20231013'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.google.truth:truth:1.1.2'
    testImplementation 'org.mockito:mockito-core:4.11.0'
}

googleJavaFormat {
    options style: 'AOSP'
}

task presubmit {
    dependsOn { ['verifyGoogleJavaFormat', 'test'] }
    doLast {
        println "Fix any formatting or test issues you see. When it looks good, submit the pull request."
    }
}
